name: logsentinel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: .

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r backend/requirements-dev.txt cfn-lint
      - name: Lint (ruff, shellcheck, cfn-lint)
        run: |
          ruff check .
          shellcheck agent/*.sh
          cfn-lint infra/template.yaml
      - name: Retrain model from scratch (tests below run against the fresh model)
        run: python ml/train.py
      - name: Backend tests
        run: cd backend && pytest -q
      - name: Frontend parity tests
        run: cd frontend && node --test tests/engine.test.mjs

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t logsentinel-api backend
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api logsentinel-api
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          jq -n --rawfile log samples/auth.log '{log:$log, host:"ci"}' \
            | curl -fsS -H 'Content-Type: application/json' -d @- localhost:8000/analyze \
            | jq -e '.summary.blocked >= 5'
